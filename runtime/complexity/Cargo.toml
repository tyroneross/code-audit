[package]
name = "code-audit-complexity"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Parser-backed per-function complexity and structural-duplicate leads for Rust, TypeScript, Java, Go and Swift. Reads source files only; never builds or runs the measured project."
publish = false

[dependencies]
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-java = "=0.23.5"
tree-sitter-go = "=0.25.0"
tree-sitter-swift = "=0.7.4"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
