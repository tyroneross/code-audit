[package]
name = "code-audit-complexity"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Parser-backed per-function complexity and structural-duplicate leads for Rust, TypeScript, JavaScript, Java, Go and Swift, plus an exact arithmetic calculator. Reads source files only; never builds or runs the measured project."
publish = false

[dependencies]
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-java = "=0.23.5"
tree-sitter-go = "=0.25.0"
tree-sitter-swift = "=0.7.4"
serde_json = "1"
sha2 = "0.10"
# Exact arithmetic for the calc subcommand.
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-rational = "=0.4.2"
num-traits = "=0.2.19"

[profile.release]
opt-level = 3
